name: Build and Release

on:
  push:
    branches: [ main ]

env:
  REPO: ${{ github.event.repository.name }}
  IMAGE_BASE: ${{ secrets.DOCKER_REGISTRY }}/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: on-prem
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.nextStrict }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: oven-sh/setup-bun@v2

    - run: bun install

    - name: Run tests
      run: |
        bunx playwright install chromium --with-deps
        bun run test

    - id: tag
      uses: ietf-tools/semver-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
        noVersionBumpBehavior: patch
        noNewCommitBehavior: current

    - run: VITE_APP_VERSION=${{ steps.tag.outputs.nextStrict }} bun run build

    - uses: docker/login-action@v4
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}

    - name: Build and push image
      run: |
        docker build -t ${IMAGE_BASE}:${{ steps.tag.outputs.nextStrict }} .
        docker push ${IMAGE_BASE}:${{ steps.tag.outputs.nextStrict }}

    - name: Create and push git tag
      run: |
        git tag ${{ steps.tag.outputs.nextStrict }}
        git push origin ${{ steps.tag.outputs.nextStrict }}

  release:
    needs: build
    runs-on: on-prem
    environment: 'Prod'
    steps:
    - name: Perform rolling update
      run: |
        kubectl -n default set image deploy/${REPO} ${REPO}=${IMAGE_BASE}:${{ needs.build.outputs.tag }}
        kubectl -n default rollout status deploy/${REPO}
